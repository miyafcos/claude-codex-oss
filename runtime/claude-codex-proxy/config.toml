owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-6-astra"
root = "gpt-6-astra"
owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-6-luna"
root = "gpt-6-luna"
owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-6-sol"
root = "gpt-6-sol"
owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-5.6-sol"
root = "gpt-5.6-sol"
owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-5.6-terra"
root = "gpt-5.6-terra"
