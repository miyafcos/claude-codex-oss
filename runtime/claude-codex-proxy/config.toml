enabled_plugins = ["codex", "oauth_codex", "claude_api", "oauth_claude", "dispatcher", "gemini_cli", "fugu", "fcc", "nanogpt"]

[logging]
level = "WARNING"

[binary]
package_manager_only = false

[plugins.codex]
detection_home_mode = "home"

[[plugins.codex.model_mappings]]
match = "gpt-6.1-sol"
target = "gpt-6.1-sol"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-6.1-terra"
target = "gpt-6.1-terra"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-6-astra"
target = "gpt-6-astra"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-6-sol"
target = "gpt-6-sol"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-6-luna"
target = "gpt-6-luna"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-5.6-sol"
target = "gpt-5.6-sol"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-5.6-terra"
target = "gpt-5.6-terra"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "gpt-5.6-luna"
target = "gpt-5.6-luna"
kind = "exact"

[[plugins.codex.model_mappings]]
match = "claude-"
target = "gpt-6-astra"
kind = "prefix"

[[plugins.codex.models_endpoint]]
id = "gpt-6.1-sol"
root = "gpt-6.1-sol"
owned_by = "openai"
permission = []

[[plugins.codex.models_endpoint]]
id = "gpt-6.1-terra"
